<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitten TTS</title>
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web": "./vendor/ort/ort.wasm.min.mjs",
      "kitten-tts": "./vendor/kitten-tts.js"
    }
  }
  </script>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="glass top">
      <div class="brand">
        <h1>😻 Kitten TTS</h1>
        <span>Offline WASM · browser cache · worker</span>
      </div>
      <div class="pill" id="readyPill">Model not loaded</div>
    </header>

    <div class="col">
      <section class="glass panel grow">
        <div class="lbl">Text <span style="font-weight:400;text-transform:none;letter-spacing:0">English only</span></div>
        <textarea id="textInput" maxlength="800" spellcheck="false" placeholder="Type English text…"></textarea>
        <p class="hint" id="textHint">A–Z, spaces, basic punctuation only.</p>
      </section>

      <section class="glass panel">
        <div class="lbl">Voice</div>
        <div class="voices-wrap">
          <div>
            <div class="vgroup-title f">♀ Female</div>
            <div class="voices" id="voicesFemale"></div>
          </div>
          <div>
            <div class="vgroup-title m">♂ Male</div>
            <div class="voices" id="voicesMale"></div>
          </div>
        </div>
      </section>

      <section class="glass panel">
        <div class="box">
          <div class="t"><span>Speed</span><strong id="speedVal">1.20×</strong></div>
          <input type="range" id="speedRange" min="0.5" max="2" step="0.05" value="1.2" />
        </div>
      </section>
    </div>

    <div class="col">
      <section class="glass panel">
        <div class="lbl">Model</div>
        <select id="modelSelect">
          <option value="local/kitten-tts-nano-int8" selected>Nano int8 · ~24 MB · recommended</option>
          <option value="local/kitten-tts-nano">Nano fp32 · ~54 MB</option>
        </select>
        <div class="model-meta">
          Approx download: <b id="sizeLabel">~24 MB</b>
          · <span class="cache-tag" id="cacheTag">checking cache…</span>
        </div>
        <div class="bar" id="progBar"><i id="progFill"></i></div>
        <div class="prog-line" id="progLine">Idle — press Load model to start.</div>
        <div class="actions">
          <button class="btn btn-p" id="loadBtn">Load model</button>
          <button class="btn btn-g" id="clearCacheBtn" title="Clear cached models">Clear cache</button>
        </div>
      </section>

      <section class="glass panel grow">
        <div class="lbl">Generate</div>
        <div class="actions">
          <button class="btn btn-p" id="generateBtn" disabled>Generate</button>
          <button class="btn btn-g" id="downloadBtn" disabled>WAV</button>
          <button class="btn btn-g" id="stopBtn" disabled>Stop</button>
        </div>
        <p class="status" id="status">Choose a model and click Load model.</p>
        <audio id="audioPlayer" controls></audio>
      </section>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
