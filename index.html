<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitten TTS Nano – Offline Browser Demo</title>
  <script type="importmap">
  {
    "imports": {
      "onnxruntime-web": "./vendor/ort/ort.wasm.min.mjs"
    }
  }
  </script>
  <style>
    :root {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2f3d;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #7c9cff;
      --accent-hover: #9bb0ff;
      --success: #34d399;
      --danger: #f87171;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    .container { width: 100%; max-width: 640px; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.35rem; }
    header p { color: var(--muted); font-size: 0.95rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    textarea {
      width: 100%;
      min-height: 120px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.85rem 1rem;
      font-size: 1rem;
      font-family: inherit;
      resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: #5f6368; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; }
    .hint.error { color: var(--danger); }
    .voices {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.5rem;
      margin-top: 0.25rem;
    }
    .voice-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.55rem 0.4rem;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .voice-btn:hover { border-color: var(--accent); }
    .voice-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #0f1117;
      font-weight: 600;
    }
    .controls { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem; }
    button.primary {
      flex: 1;
      min-width: 140px;
      background: var(--accent);
      color: #0f1117;
      border: none;
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button.secondary:hover:not(:disabled) { border-color: var(--accent); }
    button.secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .status { margin-top: 1rem; font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
    .status.loading { color: var(--accent); }
    .status.success { color: var(--success); }
    .status.error { color: var(--danger); }
    audio { width: 100%; margin-top: 1rem; border-radius: 8px; }
    footer { margin-top: 2rem; text-align: center; font-size: 0.8rem; color: var(--muted); }
    .progress {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: 0.75rem;
      overflow: hidden;
      display: none;
    }
    .progress.active { display: block; }
    .progress-bar {
      height: 100%;
      width: 30%;
      background: var(--accent);
      border-radius: 2px;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(400%); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>😻 Kitten TTS Nano</h1>
      <p>Fully offline · model + runtime hosted in this repo</p>
    </header>

    <div class="card">
      <label for="textInput">Text (English letters only)</label>
      <textarea
        id="textInput"
        placeholder="Type English text here... e.g. Hello, this is a test of Kitten TTS."
        maxlength="500"
        spellcheck="false"
      ></textarea>
      <p class="hint" id="textHint">Only A–Z, a–z, spaces, and basic punctuation allowed.</p>
    </div>

    <div class="card">
      <label>Voice</label>
      <div class="voices" id="voiceList"></div>
    </div>

    <div class="card">
      <div class="controls">
        <button class="primary" id="generateBtn" disabled>Load Model First</button>
        <button class="secondary" id="downloadBtn" disabled>Download WAV</button>
      </div>
      <div class="progress" id="progress"><div class="progress-bar"></div></div>
      <p class="status" id="status">Initializing…</p>
      <audio id="audioPlayer" controls style="display:none;"></audio>
    </div>

    <footer>
      Model files in <code>./model/</code> · ORT + kit in <code>./vendor/</code> · no CDN
    </footer>
  </div>

  <script type="module">
    import { KittenTTS } from "./vendor/kitten-tts.js";

    const VOICES = ["Bella", "Jasper", "Luna", "Bruno", "Rosie", "Hugo", "Kiki", "Leo"];
    const MODEL_ID = "local/kitten-tts-nano";

    const textInput = document.getElementById("textInput");
    const textHint = document.getElementById("textHint");
    const voiceList = document.getElementById("voiceList");
    const generateBtn = document.getElementById("generateBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const statusEl = document.getElementById("status");
    const progress = document.getElementById("progress");
    const audioPlayer = document.getElementById("audioPlayer");

    let tts = null;
    let selectedVoice = "Jasper";
    let lastAudio = null;
    let lastBlobUrl = null;

    const ALLOWED = /^[A-Za-z\s.,!?'";:\-()]+$/;

    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = "status " + type;
    }

    function filterInput(value) {
      return value.replace(/[^A-Za-z\s.,!?'";:\-()]/g, "");
    }

    textInput.addEventListener("input", () => {
      const filtered = filterInput(textInput.value);
      if (filtered !== textInput.value) {
        const pos = textInput.selectionStart;
        textInput.value = filtered;
        textInput.setSelectionRange(Math.max(0, pos - 1), Math.max(0, pos - 1));
        textHint.textContent = "Non-English characters were removed.";
        textHint.classList.add("error");
      } else {
        textHint.textContent = "Only A–Z, a–z, spaces, and basic punctuation allowed.";
        textHint.classList.remove("error");
      }
    });

    textInput.addEventListener("paste", (e) => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text");
      document.execCommand("insertText", false, filterInput(text));
    });

    VOICES.forEach((v) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "voice-btn" + (v === selectedVoice ? " active" : "");
      btn.textContent = v;
      btn.addEventListener("click", () => {
        selectedVoice = v;
        document.querySelectorAll(".voice-btn").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
      });
      voiceList.appendChild(btn);
    });

    async function loadModel() {
      setStatus("Loading local model (~57 MB)…", "loading");
      progress.classList.add("active");
      generateBtn.disabled = true;

      try {
        tts = await KittenTTS.from_pretrained(MODEL_ID, {
          runtime: "cpu",
          wasmSimd: true,
        });
        setStatus("Model ready. Type text and press Generate.", "success");
        generateBtn.textContent = "Generate Speech";
        generateBtn.disabled = false;
      } catch (err) {
        console.error(err);
        setStatus("Failed to load model: " + (err.message || err), "error");
        generateBtn.textContent = "Retry Load";
        generateBtn.disabled = false;
        generateBtn.onclick = () => {
          generateBtn.onclick = null;
          loadModel();
        };
      } finally {
        progress.classList.remove("active");
      }
    }

    async function generate() {
      const text = textInput.value.trim();
      if (!text) {
        setStatus("Please enter some text.", "error");
        return;
      }
      if (!ALLOWED.test(text)) {
        setStatus("Text contains invalid characters.", "error");
        return;
      }
      if (!tts) {
        setStatus("Model not loaded yet.", "error");
        return;
      }

      generateBtn.disabled = true;
      downloadBtn.disabled = true;
      progress.classList.add("active");
      setStatus("Generating speech…", "loading");
      audioPlayer.style.display = "none";

      try {
        const audio = await tts.generate(text, {
          voice: selectedVoice,
          speed: 1.0,
        });
        lastAudio = audio;
        const blob = audio.toBlob();
        if (lastBlobUrl) URL.revokeObjectURL(lastBlobUrl);
        lastBlobUrl = URL.createObjectURL(blob);
        audioPlayer.src = lastBlobUrl;
        audioPlayer.style.display = "block";
        audioPlayer.play().catch(() => {});
        downloadBtn.disabled = false;
        setStatus("Done · " + audio.duration.toFixed(2) + "s · voice: " + selectedVoice, "success");
      } catch (err) {
        console.error(err);
        setStatus("Generation failed: " + (err.message || err), "error");
      } finally {
        generateBtn.disabled = false;
        progress.classList.remove("active");
      }
    }

    downloadBtn.addEventListener("click", () => {
      if (!lastAudio) return;
      const blob = lastAudio.toBlob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "kitten-tts-" + selectedVoice.toLowerCase() + "-" + Date.now() + ".wav";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    generateBtn.addEventListener("click", generate);
    loadModel();
  </script>
</body>
</html>
